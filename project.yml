name: FaultLog

options:
  bundleIdPrefix: com.doubao.faultlog
  deploymentTarget:
    iOS: "15.0"
  createIntermediateGroups: true
  groupSortPosition: top

settings:
  base:
    SWIFT_VERSION: "5.0"
    IPHONEOS_DEPLOYMENT_TARGET: "15.0"

targets:
  FaultLog:
    type: application
    platform: iOS
    deploymentTarget: "15.0"
    sources:
      - path: Sources
    info:
      path: Support/Info.plist
      properties:
        CFBundleDisplayName: 故障台账
        CFBundleName: FaultLog
        CFBundleExecutable: $(EXECUTABLE_NAME)
        CFBundleIdentifier: $(PRODUCT_BUNDLE_IDENTIFIER)
        CFBundleInfoDictionaryVersion: "6.0"
        CFBundleDevelopmentRegion: zh_CN
        CFBundleShortVersionString: "1.1"
        CFBundleVersion: "1"
        CFBundlePackageType: APPL
        LSRequiresIPhoneOS: true
        LSApplicationCategoryType: public.app-category.productivity
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        NSCameraUsageDescription: 需要使用相机拍摄设备故障照片，照片仅保存在本机
        NSMicrophoneUsageDescription: 需要麦克风录制节奏异响或口述问题描述
        NSSpeechRecognitionUsageDescription: 需要语音识别把口述内容转成问题描述
        NSLocationWhenInUseUsageDescription: 需要记录故障发生的现场位置
        NSFaceIDUsageDescription: 需要使用 Face ID 解锁台账中的客户数据
        NSPhotoLibraryUsageDescription: 需要从相册选择设备故障照片
        NSPhotoLibraryAddUsageDescription: 需要保存导出的表格文件
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.doubao.faultlog
        PRODUCT_NAME: FaultLog
        MARKETING_VERSION: "1.1"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: "NO"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_BITCODE: "NO"
        SWIFT_EMIT_LOC_STRINGS: "NO"
        SUPPORTS_MACCATALYST: "NO"

schemes:
  FaultLog:
    build:
      targets:
        FaultLog: all
    run:
      config: Debug
    archive:
      config: Release
