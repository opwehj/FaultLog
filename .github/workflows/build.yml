name: Build Unsigned IPA

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15-intel

    steps:
      - name: 拉取仓库
        uses: actions/checkout@v4

      - name: 下载源码包并解压
        run: |
          set +e
          URL=$(tr -d '\n\r ' < source-url.txt)
          echo "源码包地址：$URL"
          ok=0
          for i in 1 2 3; do
            echo "第 $i 次尝试下载……"
            curl -fL --retry 2 --retry-delay 3 --max-time 240 -A "Mozilla/5.0" -o /tmp/src.zip "$URL"
            rc=$?
            echo "curl 返回码：$rc"
            if [ $rc -eq 0 ] && unzip -tq /tmp/src.zip >/dev/null 2>&1; then ok=1; break; fi
            sleep 4
          done
          if [ $ok -eq 1 ]; then
            echo "使用 CDN 源码包解压覆盖"
            unzip -o -q /tmp/src.zip -d .
          else
            echo "::warning::CDN 源码包不可用，回退使用仓库内源码"
          fi
          echo "--- 源码文件 ---"
          find Sources -name "*.swift" | sort
          echo "--- 工程描述 ---"
          ls -l project.yml

      - name: 安装 XcodeGen
        run: brew install xcodegen || brew upgrade xcodegen

      - name: 生成 Xcode 工程
        run: xcodegen generate

      - name: 编译（不签名）
        run: |
          set -o pipefail
          xcodebuild \
            -project FaultLog.xcodeproj \
            -scheme FaultLog \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGN_ENTITLEMENTS="" \
            build 2>&1 | tee build.log | tail -n 120

      - name: 打包 IPA
        if: success()
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/FaultLog.app Payload/
          zip -qry FaultLog.ipa Payload
          ls -lh FaultLog.ipa

      - name: 上传构建产物
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: FaultLog-ipa
          path: FaultLog.ipa
          if-no-files-found: error

      - name: 发布到 Release
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete v1.0 --yes 2>/dev/null || true
          gh release create v1.0 FaultLog.ipa \
            --title "FaultLog v1.1（未签名 IPA）" \
            --notes "直接用 TrollStore 安装（支持 iOS 15+）。"

      - name: 上传到公开镜像（免登录下载）
        if: success()
        run: |
          set +e
          M=""
          R1=$(curl -fsS --max-time 90 -F "file=@FaultLog.ipa" -F "expires=72" https://0x0.st 2>&1)
          echo "0x0.st -> $R1"
          if echo "$R1" | head -n1 | grep -q '^https'; then M=$(echo "$R1" | head -n1); fi
          if [ -z "$M" ]; then
            R2=$(curl -fsS --max-time 90 -F "file=@FaultLog.ipa" https://envs.sh 2>&1)
            echo "envs.sh -> $R2"
            if echo "$R2" | head -n1 | grep -q '^https'; then M=$(echo "$R2" | head -n1); fi
          fi
          if [ -z "$M" ]; then
            R3=$(curl -fsS --max-time 90 -F "file=@FaultLog.ipa" https://tmpfiles.org/api/v1/upload 2>&1)
            echo "tmpfiles -> $R3"
            U=$(echo "$R3" | sed -n 's/.*"url":"\([^"]*\)".*/\1/p')
            if [ -n "$U" ]; then M=$(echo "$U" | sed 's#tmpfiles.org/#tmpfiles.org/dl/#'); fi
          fi
          echo "MIRROR_URL=$M" >> $GITHUB_ENV
          echo "最终镜像地址：${M:-（全部失败）}"

      - name: 写回构建报告
        if: always()
        run: |
          {
            echo "# CI 构建报告"
            echo ""
            echo "- 时间（UTC）：$(date -u '+%Y-%m-%d %H:%M:%S')"
            echo "- 任务结果：${{ job.status }}"
            echo "- 运行器：macos-15-intel"
            echo "- IPA 大小（字节）：$(stat -f%z FaultLog.ipa 2>/dev/null || echo 0)"
            echo "- 公开镜像地址：${MIRROR_URL:-（未获得）}"
            echo ""
            echo "## 编译错误（前 60 条）"
            echo ""
            echo '```'
            grep -n "error:" build.log 2>/dev/null | head -60 || echo "(无匹配)"
            echo '```'
            echo ""
            echo "## 警告（前 20 条）"
            echo ""
            echo '```'
            grep -n "warning:" build.log 2>/dev/null | head -20 || echo "(无匹配)"
            echo '```'
            echo ""
            echo "## 日志尾部（400 行）"
            echo ""
            echo '```'
            tail -n 400 build.log 2>/dev/null || echo "(无日志)"
            echo '```'
          } > ci-report.md
          head -80 ci-report.md

      - name: 回写源码到仓库
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Sources project.yml tools Support ci-report.md 2>/dev/null || true
          git commit -m "build: 同步源码与构建报告 $(date -u '+%Y-%m-%dT%H:%M:%SZ')" || echo "无变更"
          git push || echo "推送失败"
